<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato e envie sua mensagem pelo WhatsApp.">
    <title>Contato | Fale Conosco</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <nav>
        <a class="nav-item" href="../Home">
            <img class="nav-icon" src="../assets/icons/botao-home.png" alt="">
            <p>Home</p>
        </a>
          <a class="nav-item" href="../Institution">
            <img class="nav-icon" src="../assets/icons/botao-home.png" alt="">
            <p>Instituição</p>
        </a>
          <a class="nav-item" href="../Products">
            <img class="nav-icon" src="../assets/icons/botao-home.png" alt="">
            <p>Produtos</p>
        </a>
          <a class="nav-item" href="../Contact">
            <img class="nav-icon" src="../assets/icons/botao-home.png" alt="">
            <p>Contato</p>
        </a>
     </nav>

     <div id="wrap-open" class="wrap-open" onclick="openMenu()" role="button" aria-label="Abrir menu" tabindex="0">
        <img src="../assets/icons/menu-aberto.png" alt="">
     </div>

     <div id="menu-mobile" aria-hidden="true">
        <img onclick="fechar()" src="../assets/icons/marca-cruzada.png" alt="Fechar menu" role="button" tabindex="0">
        <a href="../Home">Home</a>
        <a href="../Institution">Instituição</a>
        <a href="../Products">Produtos</a>
        <a href="../Contact">Contato</a>
     </div>

     <main>
        <section class="contact-section">
            <div class="img-div" role="img" aria-label="Conversa pelo WhatsApp"></div>
            <div class="form-panel">
                <div class="form-header">
                    <img src="../assets/icons/pngtree-whatsapp-icon-new-png-image_6315990.png" alt="">
                    <span class="eyebrow">WhatsApp</span>
                    <h1>Vamos conversar</h1>
                    <p>Preencha os campos e nossa equipe será aberta no WhatsApp.</p>
                </div>

                <form class="formulario" onsubmit="enviar(event)" novalidate>
                    <div class="wrap-inputs">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>
                        <span class="error" id="nome-error"></span>
                    </div>
                    <div class="wrap-inputs">
                        <label for="assunto">Mensagem</label>
                        <textarea id="assunto" name="assunto" placeholder="Como podemos ajudar?" rows="4" required></textarea>
                        <span class="error" id="assunto-error"></span>
                    </div>
                    <button type="submit">Enviar pelo WhatsApp</button>
                </form>
            </div>
        </section>
     </main>

     <script src="script.js"></script>
</body>
</html>
